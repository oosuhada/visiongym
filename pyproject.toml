[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-reasoning-lab"
version = "0.1.1"
description = "Synthetic VLM reasoning benchmark with automatic ground truth, QLoRA fine-tuning, and ID/OOD failure analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "PyYAML>=6.0.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
vlm = [
  "torch>=2.3",
  "torchvision>=0.18",
  "transformers>=4.57",
  "accelerate>=0.34",
  "qwen-vl-utils>=0.0.8",
  "bitsandbytes>=0.43; platform_system == 'Linux'",
]
train = [
  "torch>=2.3",
  "torchvision>=0.18",
  "transformers>=4.57",
  "accelerate>=0.34",
  "datasets>=3.0",
  "peft>=0.13",
  "trl>=0.29",
  "bitsandbytes>=0.43; platform_system == 'Linux'",
  "qwen-vl-utils>=0.0.8",
]
demo = ["gradio>=5.0"]
dev = ["pytest>=8.2"]

[project.scripts]
vlm-reasoning-lab = "visiongym.cli:main"
# Backward-compatible alias retained for existing notebooks and deployments.
visiongym = "visiongym.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

